name: sonar

# Non-blocking SonarCloud analysis. NOT one of the five required checks (see
# docs/50-deployment/rebuild/main-ruleset.json) - this workflow exists to
# supersede the SonarCloud GitHub App's automatic analysis, which was
# reporting this repo under a stale project key (vxture_Model-Cortex - the
# model-platform service's pre-Atlas internal codename, deprecated
# 2026-07-24). Explicit CI-based analysis under the correct key
# (sonar-project.properties) takes precedence once SonarCloud sees a scanner
# run for the repo.
#
# This job reports its real exit status. It carried `continue-on-error: true`
# from the repo split until 2026-08-06, on the stated assumption that the only
# thing missing was the `atlas` project's GitHub binding. That assumption was
# wrong, and the flag hid the evidence: every run since the split has failed
# with `403 Forbidden` from api.sonarcloud.io while the job reported success.
# The org-level SONAR_TOKEN (created 2026-07-14, visibility ALL) is rejected
# outright - vxture-platform's own Sonar job fails identically, so this is an
# org credential problem, not an atlas binding problem. See TD-027.
#
# A red job here blocks nothing (this is not one of the five required checks).
# It is red so that "Atlas has never been scanned" is visible instead of
# disguised, which is the entire failure mode the flag produced.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: sonar-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Generate Prisma client
        run: pnpm --filter @atlas/service db:generate

      - name: Run tests (coverage)
        run: pnpm --filter @atlas/service test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

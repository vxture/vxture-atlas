# SonarQube Cloud Configuration
#
# projectKey is `vxture_Model-Cortex` and that is CORRECT, however wrong it
# looks. SonarCloud project keys are immutable: a project is keyed at import
# from the GitHub repo name of the day, and renaming the repo updates only the
# display name. `Model-Cortex` was this service's codename when it was first
# imported; the Sonar project now displays as `vxture-atlas` and is bound to
# this repo. Do not "clean it up" - changing it points the scan at a project
# that does not exist, and the Free plan does not let a scanner provision one.
#
# The whole org looks like this: vxture-karda is keyed vxture_Knowledge-Vault,
# vxture-runa is vxture_Ability-Runa, vxture-platform is vxture_vxture.
#
# This file previously declared `atlas`, which resolves to nothing. Verified
# against the live console 2026-08-06: `atlas`, `vxture-atlas`, `vxture_atlas`
# and `vxture_vxture-atlas` all 404. See TD-027.
sonar.projectKey=vxture_Model-Cortex
sonar.organization=vx-6b309295f6500aba6b2a71a29ee27de77fa41583
sonar.host.url=https://sonarcloud.io

sonar.projectName=Atlas
sonar.projectVersion=0.1.0

# Single-service repo (services profile, product_240 section 2.5) - no
# packages/portals to enumerate like the platform monorepo.
sonar.sources=service/src
sonar.tests=service/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  service/src/generated/**

sonar.javascript.lcov.reportPaths=service/coverage/lcov.info

sonar.sourceEncoding=UTF-8

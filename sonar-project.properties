# SonarQube Cloud Configuration
#
# projectKey convention (org-wide, settled 2026-08-06): `vxture_<repo-name>`.
# That is `{github org}_{repo}`, which is what SonarCloud's own GitHub import
# produces, and the org prefix keeps the key unique across all of SonarCloud.
#
# A key is NOT derived from the repo at analysis time - it is frozen at import
# and a repo rename updates only the Sonar display name. Every project in the
# org had drifted: this one was `vxture_Model-Cortex` (the pre-Atlas codename),
# karda was `vxture_Knowledge-Vault`, runa was `vxture_Ability-Runa`, platform
# was `vxture_vxture`. All nine were realigned to the convention above via
# Project > Administration > Update key.
#
# This file previously declared `atlas`, which matched no project at all. If a
# scan ever runs against a key that does not exist, SonarCloud does not error
# usefully - on a paid plan it silently creates a second project, and on the
# Free plan it simply cannot. See TD-027.
sonar.projectKey=vxture_vxture-atlas
sonar.organization=vx-6b309295f6500aba6b2a71a29ee27de77fa41583
sonar.host.url=https://sonarcloud.io

sonar.projectName=Atlas
sonar.projectVersion=0.1.0

# Single-service repo (services profile, product_240 section 2.5) - no
# packages/portals to enumerate like the platform monorepo.
sonar.sources=service/src
sonar.tests=service/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  service/src/generated/**

sonar.javascript.lcov.reportPaths=service/coverage/lcov.info

sonar.sourceEncoding=UTF-8

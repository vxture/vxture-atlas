# SonarQube Cloud Configuration
#
# The SonarCloud GitHub App (org-installed, all repos) used to report this
# repo's automatic analysis under vxture_Model-Cortex - the model-platform
# service's internal codename before the Atlas repo split. That project is
# deprecated; this repo's analysis now runs explicitly (see
# .github/workflows/sonar.yml) under the key below.
sonar.projectKey=atlas
sonar.organization=vx-6b309295f6500aba6b2a71a29ee27de77fa41583
sonar.host.url=https://sonarcloud.io

sonar.projectName=Atlas
sonar.projectVersion=0.1.0

# Single-service repo (services profile, product_240 section 2.5) - no
# packages/portals to enumerate like the platform monorepo.
sonar.sources=service/src
sonar.tests=service/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  service/src/generated/**

sonar.javascript.lcov.reportPaths=service/coverage/lcov.info

sonar.sourceEncoding=UTF-8
